name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the lower bound of package.json engines; 26 is the newest stable
        # major on nodejs.org/dist (checked 2026-11-24). publish.yml stays on 24.
        node-version: ["20", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Same limit as publish.yml: the suite takes about 2 minutes on the runner.
        timeout-minutes: 15
        run: npm test

      - name: Build
        run: |
          npm run build
          test -x cli/dist/index.js
