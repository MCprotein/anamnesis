name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npmjs-and-github-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: |
          npm run build
          test -x cli/dist/index.js

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${PACKAGE_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Check npmjs.org published version
        id: npmjs_published
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org --@mcprotein:registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs.org
        if: steps.npmjs_published.outputs.exists != 'true'
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          publish_log="$(mktemp)"

          if npm publish --ignore-scripts --access public 2>&1 | tee "$publish_log"; then
            exit 0
          fi

          if grep -q "previously published versions" "$publish_log" &&
             npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org --@mcprotein:registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; treating duplicate publish as success."
            exit 0
          fi

          exit 1

      - name: Configure GitHub Packages npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          {
            echo "@mcprotein:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } >> "$npmrc"

      - name: Check GitHub Packages published version
        id: github_packages_published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://npm.pkg.github.com --@mcprotein:registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        if: steps.github_packages_published.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          publish_log="$(mktemp)"

          npm pkg set publishConfig.registry=https://npm.pkg.github.com

          if npm publish --ignore-scripts --access public --registry https://npm.pkg.github.com 2>&1 | tee "$publish_log"; then
            exit 0
          fi

          if grep -q "previously published versions" "$publish_log" &&
             npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://npm.pkg.github.com --@mcprotein:registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published to GitHub Packages; treating duplicate publish as success."
            exit 0
          fi

          exit 1

      - name: Verify registry parity
        timeout-minutes: 20
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          # A just-published version can take minutes to appear in the
          # registry read path. v1.25.0 and v1.25.1 both failed a 15-second
          # window although both publishes succeeded. Each registry gets up to
          # ~4.25 min (255 s) of backoff sleeps plus up to 10 s per lookup.
          MAX_ATTEMPTS=12
          verify_registry() {
            local registry="$1"
            local actual=""
            local attempt
            local delay
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              if actual="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry "$registry" --@mcprotein:registry="$registry" --fetch-retries=0 --fetch-timeout=10000)"; then
                if [[ "$actual" = "$PACKAGE_VERSION" ]]; then
                  return 0
                fi
                echo "::error::$registry returned $actual; expected $PACKAGE_VERSION."
                return 1
              fi
              if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
                delay=$(( attempt * 5 < 30 ? attempt * 5 : 30 ))
                echo "$registry lookup failed (attempt $attempt/$MAX_ATTEMPTS); retrying in $delay seconds."
                sleep "$delay"
              fi
            done
            echo "::error::$registry did not confirm $PACKAGE_VERSION after $MAX_ATTEMPTS attempts."
            return 1
          }

          verify_registry https://registry.npmjs.org
          verify_registry https://npm.pkg.github.com
          echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is published to npmjs.org and GitHub Packages."

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          export TAG PACKAGE_NAME PACKAGE_VERSION

          node <<'NODE'
          const fs = require("node:fs");

          const tag = process.env.TAG;
          const packageName = process.env.PACKAGE_NAME;
          const packageVersion = process.env.PACKAGE_VERSION;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const escapedVersion = packageVersion.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const sectionPattern = new RegExp(
            `(?:^|\\n)## \\[${escapedVersion}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)`,
          );
          const section = changelog.match(sectionPattern)?.[1]?.trim();

          const body = [
            section || `Release ${tag}.`,
            "",
            "### Published package",
            `- \`${packageName}@${packageVersion}\` on npmjs.org`,
            `- \`${packageName}@${packageVersion}\` on GitHub Packages`,
            "",
          ].join("\n");

          fs.writeFileSync("release-notes.md", body);
          NODE

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
