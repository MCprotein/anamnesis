<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Work continuity paired token savings across Luna, Terra, and Sol</title>
  <desc id="desc">Scenario-level median token change with Work enabled versus disabled. Luna uses nine strict pairs per scenario; Terra and Sol use three diagnostic pairs. All models show overall savings near 50 percent, while Terra delegation and review is nearly unchanged at 0.19 percent savings.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #596579; }
    .metric-label { font-size: 10px; fill: #596579; }
    .metric-value { font-size: 19px; font-weight: 700; }
    .scenario { font-size: 13px; font-weight: 600; }
    .value { font-size: 11px; font-variant-numeric: tabular-nums; }
    .axis-label { font-size: 11px; fill: #667085; }
    .legend { font-size: 12px; }
    .grid { stroke: #d0d5dd; stroke-width: 1; }
    .zero { stroke: #667085; stroke-width: 1.5; }
  </style>
  <rect width="1000" height="650" fill="#ffffff" />
  <text x="32" y="38" class="title">Cross-model Work token savings</text>
  <text x="32" y="62" class="subtitle">Same six scenarios · scenario bars show paired p50 · negative change means fewer tokens with Work</text>

  <text x="32" y="96" class="metric-label">LUNA AVG/RUN · N=9 STRICT</text>
  <text x="32" y="122" class="metric-value" fill="#2563eb">−50.30%</text>
  <text x="210" y="96" class="metric-label">TERRA AVG/RUN · N=3</text>
  <text x="210" y="122" class="metric-value" fill="#d97706">−50.80%</text>
  <text x="395" y="96" class="metric-label">SOL AVG/RUN · N=3</text>
  <text x="395" y="122" class="metric-value" fill="#7c3aed">−53.76%</text>
  <text x="585" y="96" class="metric-label">ENABLED STATUS RECALL</text>
  <text x="585" y="122" class="metric-value" fill="#047857">100% · all</text>
  <text x="790" y="96" class="metric-label">TOKEN PAIR WINS</text>
  <text x="790" y="122" class="metric-value" fill="#047857">53/54 · 18/18 · 18/18</text>

  <rect x="32" y="148" width="12" height="12" rx="2" fill="#2563eb" />
  <text x="51" y="159" class="legend">Luna n=9 strict</text>
  <rect x="170" y="148" width="12" height="12" rx="2" fill="#d97706" />
  <text x="189" y="159" class="legend">Terra n=3 diagnostic</text>
  <rect x="350" y="148" width="12" height="12" rx="2" fill="#7c3aed" />
  <text x="369" y="159" class="legend">Sol n=3 diagnostic</text>

  <line x1="340" x2="820" y1="184" y2="184" class="grid" />
  <line x1="340" x2="340" y1="180" y2="526" class="grid" />
  <line x1="500" x2="500" y1="180" y2="526" class="grid" />
  <line x1="660" x2="660" y1="180" y2="526" class="grid" />
  <line x1="820" x2="820" y1="174" y2="532" class="zero" />
  <text x="340" y="552" text-anchor="middle" class="axis-label">−60%</text>
  <text x="500" y="552" text-anchor="middle" class="axis-label">−40%</text>
  <text x="660" y="552" text-anchor="middle" class="axis-label">−20%</text>
  <text x="820" y="552" text-anchor="middle" class="axis-label">0%</text>

  <text x="32" y="226" class="scenario">Perfect handoff</text>
  <rect x="420.08" y="207" width="399.92" height="10" rx="2" fill="#2563eb" />
  <rect x="552.08" y="220" width="267.92" height="10" rx="2" fill="#d97706" />
  <rect x="420.16" y="233" width="399.84" height="10" rx="2" fill="#7c3aed" />
  <text x="840" y="229" class="value">−49.99 / −33.49 / −49.98%</text>

  <text x="32" y="278" class="scenario">Bounded loss</text>
  <rect x="422.56" y="259" width="397.44" height="10" rx="2" fill="#2563eb" />
  <rect x="421.84" y="272" width="398.16" height="10" rx="2" fill="#d97706" />
  <rect x="422.72" y="285" width="397.28" height="10" rx="2" fill="#7c3aed" />
  <text x="840" y="281" class="value">−49.68 / −49.77 / −49.66%</text>

  <text x="32" y="330" class="scenario">Stale conflict</text>
  <rect x="420" y="311" width="400" height="10" rx="2" fill="#2563eb" />
  <rect x="339.68" y="324" width="480.32" height="10" rx="2" fill="#d97706" />
  <rect x="419.6" y="337" width="400.4" height="10" rx="2" fill="#7c3aed" />
  <text x="840" y="333" class="value">−50.00 / −60.04 / −50.05%</text>

  <text x="32" y="382" class="scenario">Multi-session handoff</text>
  <rect x="411.68" y="363" width="408.32" height="10" rx="2" fill="#2563eb" />
  <rect x="332.96" y="376" width="487.04" height="10" rx="2" fill="#d97706" />
  <rect x="337.12" y="389" width="482.88" height="10" rx="2" fill="#7c3aed" />
  <text x="840" y="385" class="value">−51.04 / −60.88 / −60.36%</text>

  <text x="32" y="434" class="scenario">Delegation / review</text>
  <rect x="419.6" y="415" width="400.4" height="10" rx="2" fill="#2563eb" />
  <rect x="818.48" y="428" width="1.52" height="10" rx="1" fill="#d97706" />
  <rect x="419.84" y="441" width="400.16" height="10" rx="2" fill="#7c3aed" />
  <text x="840" y="437" class="value">−50.05 / −0.19 / −50.02%</text>

  <text x="32" y="486" class="scenario">100 requirements</text>
  <rect x="334.72" y="467" width="485.28" height="10" rx="2" fill="#2563eb" />
  <rect x="328.08" y="480" width="491.92" height="10" rx="2" fill="#d97706" />
  <rect x="324.48" y="493" width="495.52" height="10" rx="2" fill="#7c3aed" />
  <text x="840" y="489" class="value">−60.66 / −61.49 / −61.94%</text>

  <text x="32" y="596" class="subtitle">All three models show overall savings, but n=3 reveals model variance: Terra delegation/review is −0.19% while Sol is −50.02%.</text>
  <text x="32" y="620" class="subtitle">Use Luna n=9 as the release-quality baseline; Terra and Sol n=3 are directional cross-model evidence.</text>
</svg>
