<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Work continuity paired token savings across Luna and Terra</title>
  <desc id="desc">Scenario-level median token change with Work enabled versus disabled. The Luna strict benchmark uses nine pairs per scenario and the Terra diagnostic uses three. Both show overall savings near 50 percent, while Terra delegation and review is nearly unchanged at 0.19 percent savings.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #596579; }
    .metric-label { font-size: 11px; fill: #596579; }
    .metric-value { font-size: 20px; font-weight: 700; }
    .scenario { font-size: 13px; font-weight: 600; }
    .value { font-size: 12px; font-variant-numeric: tabular-nums; }
    .axis-label { font-size: 11px; fill: #667085; }
    .legend { font-size: 12px; }
    .grid { stroke: #d0d5dd; stroke-width: 1; }
    .zero { stroke: #667085; stroke-width: 1.5; }
  </style>
  <rect width="1000" height="610" fill="#ffffff" />
  <text x="32" y="38" class="title">Cross-model Work token savings</text>
  <text x="32" y="62" class="subtitle">Same six scenarios · scenario bars show paired p50 · negative change means fewer tokens with Work</text>

  <text x="32" y="98" class="metric-label">LUNA AVG TOKENS/RUN · N=9 STRICT</text>
  <text x="32" y="124" class="metric-value" fill="#2563eb">−50.30%</text>
  <text x="260" y="98" class="metric-label">TERRA AVG TOKENS/RUN · N=3 DIAGNOSTIC</text>
  <text x="260" y="124" class="metric-value" fill="#d97706">−50.80%</text>
  <text x="545" y="98" class="metric-label">STATUS RECALL WITH WORK</text>
  <text x="545" y="124" class="metric-value" fill="#047857">100% · both</text>
  <text x="790" y="98" class="metric-label">TOKEN PAIR WINS</text>
  <text x="790" y="124" class="metric-value" fill="#047857">53/54 · 18/18</text>

  <rect x="32" y="151" width="12" height="12" rx="2" fill="#2563eb" />
  <text x="51" y="162" class="legend">Luna n=9 strict</text>
  <rect x="170" y="151" width="12" height="12" rx="2" fill="#d97706" />
  <text x="189" y="162" class="legend">Terra n=3 diagnostic</text>

  <line x1="340" x2="820" y1="188" y2="188" class="grid" />
  <line x1="340" x2="340" y1="184" y2="500" class="grid" />
  <line x1="500" x2="500" y1="184" y2="500" class="grid" />
  <line x1="660" x2="660" y1="184" y2="500" class="grid" />
  <line x1="820" x2="820" y1="178" y2="506" class="zero" />
  <text x="340" y="524" text-anchor="middle" class="axis-label">−60%</text>
  <text x="500" y="524" text-anchor="middle" class="axis-label">−40%</text>
  <text x="660" y="524" text-anchor="middle" class="axis-label">−20%</text>
  <text x="820" y="524" text-anchor="middle" class="axis-label">0%</text>

  <text x="32" y="220" class="scenario">Perfect handoff</text>
  <rect x="420.08" y="204" width="399.92" height="12" rx="2" fill="#2563eb" />
  <rect x="552.08" y="220" width="267.92" height="12" rx="2" fill="#d97706" />
  <text x="840" y="220" class="value">−49.99 / −33.49%</text>

  <text x="32" y="270" class="scenario">Bounded loss</text>
  <rect x="422.56" y="254" width="397.44" height="12" rx="2" fill="#2563eb" />
  <rect x="421.84" y="270" width="398.16" height="12" rx="2" fill="#d97706" />
  <text x="840" y="270" class="value">−49.68 / −49.77%</text>

  <text x="32" y="320" class="scenario">Stale conflict</text>
  <rect x="420" y="304" width="400" height="12" rx="2" fill="#2563eb" />
  <rect x="339.68" y="320" width="480.32" height="12" rx="2" fill="#d97706" />
  <text x="840" y="320" class="value">−50.00 / −60.04%</text>

  <text x="32" y="370" class="scenario">Multi-session handoff</text>
  <rect x="411.68" y="354" width="408.32" height="12" rx="2" fill="#2563eb" />
  <rect x="332.96" y="370" width="487.04" height="12" rx="2" fill="#d97706" />
  <text x="840" y="370" class="value">−51.04 / −60.88%</text>

  <text x="32" y="420" class="scenario">Delegation / review</text>
  <rect x="419.6" y="404" width="400.4" height="12" rx="2" fill="#2563eb" />
  <rect x="818.48" y="420" width="1.52" height="12" rx="1" fill="#d97706" />
  <text x="840" y="420" class="value">−50.05 / −0.19%</text>

  <text x="32" y="470" class="scenario">100 requirements</text>
  <rect x="334.72" y="454" width="485.28" height="12" rx="2" fill="#2563eb" />
  <rect x="328.08" y="470" width="491.92" height="12" rx="2" fill="#d97706" />
  <text x="840" y="470" class="value">−60.66 / −61.49%</text>

  <text x="32" y="558" class="subtitle">Overall averages agree, but n=3 exposes model-specific variance: Terra delegation/review is directionally non-regressive with almost no token saving.</text>
  <text x="32" y="582" class="subtitle">Use Luna n=9 as the release-quality baseline; use Terra n=3 only as cross-model directional evidence.</text>
</svg>
