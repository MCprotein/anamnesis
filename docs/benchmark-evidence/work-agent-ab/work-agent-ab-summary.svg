<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Work continuity strict real Codex A/B benchmark</title>
  <desc id="desc">Nine paired runs across six scenarios. Work enabled reduced average total tokens by 50.30 percent and elapsed time by 44.19 percent, improved status recall from 72.59 to 100 percent, and passed all strict correctness and non-regression gates.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #596579; }
    .section { font-size: 16px; font-weight: 700; }
    .metric-label { font-size: 12px; fill: #596579; }
    .metric-value { font-size: 20px; font-weight: 700; }
    .label { font-size: 13px; }
    .value { font-size: 12px; font-weight: 700; }
    .axis-label { font-size: 11px; fill: #667085; }
    .grid { stroke: #d0d5dd; stroke-width: 1; }
    .zero { stroke: #667085; stroke-width: 1.5; }
  </style>
  <rect width="1100" height="650" fill="#ffffff" />
  <text x="32" y="38" class="title">Work continuity: strict real Codex A/B</text>
  <text x="32" y="62" class="subtitle">gpt-5.6-luna · 6 scenarios × 9 paired runs · 108 initial calls · 153 total with corrections</text>
  <text x="32" y="100" class="metric-label">AVERAGE TOTAL TOKENS</text>
  <text x="32" y="126" class="metric-value" fill="#047857">−50.30%</text>
  <text x="250" y="100" class="metric-label">AVERAGE ELAPSED TIME</text>
  <text x="250" y="126" class="metric-value" fill="#047857">−44.19%</text>
  <text x="468" y="100" class="metric-label">STATUS RECALL</text>
  <text x="468" y="126" class="metric-value" fill="#047857">72.59% → 100%</text>
  <text x="700" y="100" class="metric-label">STRICT CONTRACT</text>
  <text x="700" y="126" class="metric-value" fill="#047857">PASS</text>
  <text x="32" y="174" class="section">Paired token delta by scenario (p50)</text>
  <text x="32" y="196" class="subtitle">Work enabled versus disabled; negative values are savings</text>
  <line x1="280" x2="920" y1="222" y2="222" class="grid" />
  <line x1="280" x2="280" y1="218" y2="510" class="grid" />
  <line x1="440" x2="440" y1="218" y2="510" class="grid" />
  <line x1="600" x2="600" y1="218" y2="510" class="grid" />
  <line x1="760" x2="760" y1="212" y2="516" class="zero" />
  <line x1="920" x2="920" y1="218" y2="510" class="grid" />
  <text x="280" y="532" text-anchor="middle" class="axis-label">−60%</text>
  <text x="440" y="532" text-anchor="middle" class="axis-label">−40%</text>
  <text x="600" y="532" text-anchor="middle" class="axis-label">−20%</text>
  <text x="760" y="532" text-anchor="middle" class="axis-label">0%</text>
  <text x="920" y="532" text-anchor="middle" class="axis-label">+20%</text>
  <text x="32" y="248" class="label">Perfect handoff</text>
  <rect x="360" y="232" width="400" height="22" rx="3" fill="#059669" />
  <text x="352" y="248" text-anchor="end" class="value">−49.99%</text>
  <text x="32" y="294" class="label">Bounded loss</text>
  <rect x="363" y="278" width="397" height="22" rx="3" fill="#059669" />
  <text x="355" y="294" text-anchor="end" class="value">−49.68%</text>
  <text x="32" y="340" class="label">Stale conflict</text>
  <rect x="360" y="324" width="400" height="22" rx="3" fill="#059669" />
  <text x="352" y="340" text-anchor="end" class="value">−50.00%</text>
  <text x="32" y="386" class="label">Multi-session handoff</text>
  <rect x="352" y="370" width="408" height="22" rx="3" fill="#059669" />
  <text x="344" y="386" text-anchor="end" class="value">−51.04%</text>
  <text x="32" y="432" class="label">Delegation / review</text>
  <rect x="360" y="416" width="400" height="22" rx="3" fill="#059669" />
  <text x="352" y="432" text-anchor="end" class="value">−50.05%</text>
  <text x="32" y="478" class="label">100 requirements</text>
  <rect x="275" y="462" width="485" height="22" rx="3" fill="#059669" />
  <text x="267" y="478" text-anchor="end" class="value">−60.66%</text>
  <text x="32" y="580" class="section">Strict quality and paired timing</text>
  <text x="32" y="606" class="subtitle">Enabled completion/gate correctness and requirement/status/summary recall: 100% · elapsed p50: −49.56% · elapsed wins: 49/54</text>
  <text x="32" y="628" class="subtitle">Targeted multi-session/delegation bootstrap-high gates passed; hallucinated and duplicate requirements: 0</text>
</svg>
